name: Android

# Chaque push sur main : si le tag vX.Y.Z (fichier VERSION) n'existe pas,
# build de l'APK signé + tag + GitHub Release. Sinon : build de vérification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire VERSION
        id: version
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Le tag v$V existe déjà : build de vérification uniquement."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version v$V."
          fi

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK non signé."
          fi

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Préparer l'APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="Trame-v${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "signed=$([ -n "$KEYSTORE_PATH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Changelog
        if: steps.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Nouveautés"
            echo
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            git log $RANGE --no-merges --pretty='- %s' | head -n 50
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Publier la release
        if: steps.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.apk.outputs.signed }}" != "true" ]; then
            echo "::error::Release refusée : APK non signé (secrets manquants)."
            exit 1
          fi
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" "${{ steps.apk.outputs.file }}" \
            --title "Trame $V" \
            --notes-file CHANGELOG.md \
            --target "$GITHUB_SHA"
